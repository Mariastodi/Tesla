services:
  - type: web
    name: projeto-tesla
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PIN
        generateValue: true
      - key: CPF_SALT
        generateValue: true
      - key: DEVICE_SECRET
        generateValue: true
